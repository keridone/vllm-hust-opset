name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Unit tests
        run: uv run --with pytest pytest -q
      - name: Ruff
        run: uv run --with ruff ruff check src tests experiments
      - name: Build distributions
        run: uv build --no-sources
